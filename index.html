:root { --bg: #E8ECEF; --card: #FAFAFA; --ink: #1F2933; --muted: #616E7C; --green: #1D5C4B; --rust: #B4532A; --rule: #CBD2D9; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #12201C; --card: #1B2B26; --ink: #E3EEEA; --muted: #9DB3AA; --green: #7CCDB2; --rust: #E39A74; --rule: #34493F; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #12201C; --card: #1B2B26; --ink: #E3EEEA; --muted: #9DB3AA; --green: #7CCDB2; --rust: #E39A74; --rule: #34493F; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: 'Lato', Arial, sans-serif;

main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--rule); padding: 28px 24px 24px; }
h1 { margin: 0 0 8px; font-family: 'League Spartan', 'Arial Black', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 24px; line-height: 26px; color: var(--green); }
p { margin: 0 0 16px; font-size: 15px; line-height: 21px; color: var(--muted); }
label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 6px; }
input { width: 100%; font: inherit; font-size: 16px; padding: 9px 10px; border: 1px solid var(--muted); border-radius: 3px; background: var(--bg); color: var(--ink); }
button { margin-top: 12px; width: 100%; font: inherit; font-weight: 700; font-size: 15px; padding: 10px; border: 0; border-radius: 3px; background: var(--green); color: var(--card); cursor: pointer; }
button:disabled { opacity: 0.6; cursor: default; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
#err { min-height: 20px; margin: 10px 0 0; font-size: 14px; color: var(--rust); }

<script>
(function () {
  var P = JSON.parse(document.getElementById('params').textContent);
  var f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), err = document.getElementById('err');
  function bytes(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  async function decrypt(password) {
    var mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iterations, hash: 'SHA-256' }, mat,
      { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.textContent = '';
    if (!(window.crypto && crypto.subtle)) { err.textContent = 'This browser cannot open the page. Try a current version of Chrome, Safari, Firefox, or Edge.'; return; }
    go.disabled = true; go.textContent = 'Opening…';
    var doc;
    try { doc = await decrypt(pw.value); }
    catch (x) { go.disabled = false; go.textContent = 'Open'; err.textContent = 'That password did not work. Check it and try again.'; pw.select(); return; }
    document.open(); document.write(doc.html); document.close();
    var a = document.querySelector('a.dl-pdf');
    if (a) { a.href = URL.createObjectURL(new Blob([bytes(doc.pdf)], { type: 'application/pdf' })); a.setAttribute('download', doc.pdf_name); }
  });
})();
</script>
